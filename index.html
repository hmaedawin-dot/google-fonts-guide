/* ============================================================
   colors.css — palette tokens
   Editorial "paper + ink" base, with four 和色-inspired category
   accents used to wayfind between font groups.
   ============================================================ */
:root {
  /* --- Ink (foreground) --- */
  --ink-1: #1B1B1B;       /* primary text, near-black neutral */
  --ink-2: #464646;       /* secondary text */
  --ink-3: #777777;       /* muted / captions */
  --ink-4: #ABABAB;       /* faint */

  /* --- Paper (surfaces) — neutral grays from #E8E8E8 base --- */
  --paper-1: #F7F7F7;     /* page background */
  --paper-2: #EFEFEF;     /* sunken / alt rows */
  --paper-3: #E6E6E6;     /* cards on paper-2 */
  --paper-pure: #FFFFFF;  /* specimen canvas */

  /* --- Lines & strokes --- */
  --line-1: #E0E0E0;      /* hairline dividers */
  --line-2: #CFCFCF;      /* stronger borders */
  --line-ink: #1B1B1B;    /* full-ink rule (editorial) */

  /* --- Brand accent: base gray #E8E8E8 — umbrella over all categories --- */
  --accent: #E8E8E8;
  --accent-hover: #D6D6D6;
  --accent-soft: #F2F2F2;
  --accent-ink: #2B2B2B;   /* legible text/icon on --accent */

  /* --- Category accents --- */
  --cat-mincho: #5A73F8;        /* 明朝体 — gradient step 1 (lightest, white-safe) */
  --cat-mincho-soft: #E4E9FE;
  --cat-gothic: #4863F2;        /* ゴシック体 — step 2 */
  --cat-gothic-soft: #E2E7FD;
  --cat-serif: #3153F6;         /* serif — step 3 (anchor) */
  --cat-serif-soft: #E1E6FD;
  --cat-sans: #2440C2;          /* sans-serif — step 4 */
  --cat-sans-soft: #DCE1F3;
  --cat-numerals: #182B82;      /* 数字 — step 5 (deepest) */
  --cat-numerals-soft: #DDE0EE;

  /* --- Semantic aliases --- */
  --bg-page: var(--paper-1);
  --bg-sunken: var(--paper-2);
  --surface-card: var(--paper-pure);
  --text-heading: var(--ink-1);
  --text-body: var(--ink-2);
  --text-muted: var(--ink-3);
  --border-hairline: var(--line-1);
  --border-strong: var(--line-2);
  --link: var(--accent);
}

}

}

  /* === sans-serif (Latin) === */
  { name: "Hanken Grotesk", category: "sans", fontFamily: "var(--font-hanken-grotesk)", weights: [300,400,500,600,700,800], note: "ニュートラルで親しみやすいジオメトリック・グロテスク。UI・ブランドに万能。", sampleWeight: 400 },
  { name: "Inter", category: "sans", fontFamily: "var(--font-inter)", weights: [400,500,600,700], note: "UI のために設計された定番サンセリフ。数字や記号も明快。", sampleWeight: 400 },
  { name: "Montserrat", category: "sans", fontFamily: "var(--font-montserrat)", weights: [400,500,600,700,800], note: "都会的で力強い。ロゴや大見出しによく合う。", sampleWeight: 500 },

  { name: "Questrial", category: "sans", fontFamily: "var(--font-questrial)", weights: [400], note: "細く端正なジオメトリック。ミニマルで上品な印象。", sampleWeight: 400 },

  { name: "Aldrich", category: "sans", fontFamily: "var(--font-aldrich)", weights: [400], note: "等幅感のあるテック調サンセリフ。未来的な見出しに。", sampleWeight: 400 },
  { name: "Cousine", category: "sans", fontFamily: "var(--font-cousine)", weights: [400,700], note: "等幅のスラブ寄り書体。コードやデータ表示に最適。", sampleWeight: 400 },
  { name: "Josefin Sans", category: "sans", fontFamily: "var(--font-josefin-sans)", weights: [300,400,500,600,700], note: "細身でエレガントなジオメトリック。ヴィンテージ感のある見出しに。", sampleWeight: 400 },
  { name: "Roboto", category: "sans", fontFamily: "var(--font-roboto)", weights: [300,400,500,700,900], note: "Android の標準書体。中庸で読みやすく、あらゆる用途に万能。", sampleWeight: 400 },
  { name: "Oswald", category: "sans", fontFamily: "var(--font-oswald)", weights: [300,400,500,600,700], note: "引き締まったコンデンス体。力強い大見出しやポスターに。", sampleWeight: 500 },

  /* === 数字 (numerals) === */
  { name: "Droid Serif", category: "numerals", fontFamily: "var(--font-droid-serif)", sample: "$1,234.56", weights: [400,700], note: "数字のプロポーションが吟味されたセリフ。画面でとても見やすい。", sampleWeight: 400 },
  { name: "Crimson Text", category: "numerals", fontFamily: "var(--font-crimson-text)", sample: "$1,234.56", weights: [400,600,700], note: "ライニング・等幅ライニングに対応。海外でも幅広く使われる定番。", sampleWeight: 400 },
  { name: "Old Standard TT", category: "numerals", fontFamily: "var(--font-old-standard-tt)", sample: "$1,234.56", weights: [400,700], note: "クラシックでエレガント。アンティークな雰囲気の数字デザイン。", sampleWeight: 400 },
  { name: "Kameron", category: "numerals", fontFamily: "var(--font-kameron)", sample: "$1,234.56", weights: [400,500,600,700], note: "幅広なスラブセリフ。落ち着いた数字が表組みに映える。", sampleWeight: 400 },
  { name: "Copse", category: "numerals", fontFamily: "var(--font-copse)", sample: "$1,234.56", weights: [400], note: "小さいサイズでも読みやすいスラブセリフ。可読性重視に。", sampleWeight: 400 },
  { name: "Open Sans", category: "numerals", fontFamily: "var(--font-open-sans)", sample: "$1,234.56", weights: [300,400,500,600,700], note: "あらゆる場面で使える定番サンセリフ。数字も安定して明快。", sampleWeight: 400 },
  { name: "Lato", category: "numerals", fontFamily: "var(--font-lato)", sample: "$1,234.56", weights: [100,300,400,700,900], note: "コントロールを抑えた柔らかな数字。Open Sans とは違う表情。", sampleWeight: 400 },
  { name: "Roboto Condensed", category: "numerals", fontFamily: "var(--font-roboto-condensed)", sample: "$1,234.56", weights: [300,400,500,700], note: "等幅ライニング数字に対応したコンデンス体。桁が揃う。", sampleWeight: 400 },
  { name: "Titillium Web", category: "numerals", fontFamily: "var(--font-titillium-web)", sample: "$1,234.56", weights: [300,400,600,700,900], note: "角張った厳格な印象。豊富なウエイトでデータ表示に強い。", sampleWeight: 400 },
  { name: "Varela Round", category: "numerals", fontFamily: "var(--font-varela-round)", sample: "$1,234.56", weights: [400], note: "丸みのある親しみやすい数字。フレンドリーな表現に。", sampleWeight: 400 },
];

</script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
/* まとめ — Google Fonts おすすめまとめ. Mounted by index.html.
   Layout: fixed yellow left sidebar (category card-buttons = in-page links)
   + MV door (yellow, no buttons) + stacked per-category colored sections. */
const { useState, useMemo, useEffect, useRef } = React;
const { FontSpecimen, CategoryButton } = window.DesignSystem_74b1d1;
const FONTS = window.FONT_DATA;
const CATS = window.CATEGORY_META;
const ORDER = ["mincho", "gothic", "serif", "sans", "numerals"];

const SIDEBAR_W = 256;

function scrollToId(id) {
  if (id === "home") { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  const el = document.getElementById(id);
  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY, behavior: "smooth" });
}

/* ---------- Sidebar (fixed, main yellow) — category card-buttons ---------- */
function Sidebar({ active }) {
  return (
    <aside style={{
      position: "fixed", top: 0, left: 0, bottom: 0, width: SIDEBAR_W, zIndex: 30,
      background: "var(--accent)", color: "var(--accent-ink)", overflowY: "auto",
      display: "flex", flexDirection: "column", padding: "26px 18px", boxShadow: "var(--shadow-md)",
    }}>
      <button onClick={() => scrollToId("home")} style={{ cursor: "pointer", background: "none", border: "none",
        padding: 0, textAlign: "left", marginBottom: 24 }}>
        <p style={{ margin: 0, fontFamily: "var(--font-ui-display)", fontWeight: 600, fontSize: 24,
          color: "var(--accent-ink)", lineHeight: 1.1 }}>フォント<br />まとめ</p>
        <p style={{ margin: "8px 0 0", fontFamily: "var(--font-label)", fontSize: 10, fontWeight: 600,
          letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--accent-ink)", opacity: 0.7 }}>
          Google Fonts
        </p>
      </button>

      <p style={{ margin: "0 0 10px 4px", fontFamily: "var(--font-label)", fontSize: 10, fontWeight: 600,
        letterSpacing: "0.16em", textTransform: "uppercase", color: "var(--accent-ink)", opacity: 0.6 }}>
        カテゴリー
      </p>
      <nav style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {ORDER.map((k) => (
          <CategoryButton
            key={k}
            category={k}
            count={FONTS.filter((f) => f.category === k).length}
            active={active === k}
            onClick={() => scrollToId("cat-" + k)}
          />
        ))}
      </nav>

      <a href="https://fonts.google.com" target="_blank" rel="noopener noreferrer"
        style={{ marginTop: "auto", paddingTop: 18, fontFamily: "var(--font-label)", fontSize: 12, fontWeight: 600,
          color: "var(--accent-ink)", textDecoration: "none", opacity: 0.8 }}>
        fonts.google.com ↗
      </a>
    </aside>
  );
}

/* ---------- MV / 扉 (main yellow, no buttons) ---------- */
function MV({ mobile }) {
  return (
    <section id="home" style={{ background: "var(--accent)", color: "var(--accent-ink)", minHeight: "100vh",
      display: "flex", flexDirection: "column", justifyContent: "center", padding: "var(--sp-9)" }}>
      <p style={{ margin: 0, fontFamily: "var(--font-label)", fontSize: 13, fontWeight: 600,
        letterSpacing: "0.18em", textTransform: "uppercase", opacity: 0.7 }}>
        Recommended Google Fonts
      </p>
      <h1 style={{ margin: "20px 0 0", fontFamily: "var(--font-ui-display)", fontWeight: 600,
        fontSize: "clamp(44px, 6vw, 96px)", lineHeight: 1.3, letterSpacing: "-0.01em", textWrap: "balance",
        maxWidth: "16ch" }}>
        迷ったらこれ。<br />定番<span style={{ color: "#3153F6" }}>Google Fonts</span>
      </h1>
      <p style={{ margin: "26px 0 0", maxWidth: "54ch", fontFamily: "var(--font-ui-jp)", fontSize: "var(--fs-lead)",
        lineHeight: "var(--lh-body)", color: "var(--accent-ink)", opacity: 0.92, textWrap: "pretty" }}>
        Google Fonts から厳選したおすすめ書体を、<br />明朝体・ゴシック体・serif・sans-serif・数字の5分類で整理しました。
      </p>
      <p style={{ margin: "34px 0 0", display: "inline-flex", alignItems: "center", gap: 12,
        fontFamily: "var(--font-ui-jp)", fontSize: "var(--fs-body)", fontWeight: 600, color: "var(--accent-ink)" }}>
        <span aria-hidden="true" style={{ fontSize: 22 }}>{mobile ? "↓" : "←"}</span>
        {mobile ? "下のメニューから選んでください。" : "左のカテゴリーから選んでください。"}
      </p>
    </section>
  );
}

/* ---------- Category section (own background color) ---------- */
function CategorySection({ catKey, mobile }) {
  const c = CATS[catKey];
  const HEADING_FONT = {
    mincho: "'Shippori Mincho', 'EB Garamond', serif",
    gothic: "'Noto Sans JP', 'Inter', sans-serif",
    serif: "'EB Garamond', 'Shippori Mincho', serif",
    sans: "'Inter', 'Noto Sans JP', sans-serif",
    numerals: "'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif",
  };
  const headFont = HEADING_FONT[catKey] || "var(--font-ui-display)";
  const ink = c.ink || "#fff";
  const inkMuted = ink === "#fff" ? "rgba(255,255,255,0.92)" : "rgba(0,0,0,0.66)";
  const [query, setQuery] = useState("");
  const fonts = useMemo(() => {
    const q = query.trim().toLowerCase();
    return FONTS.filter((f) => f.category === catKey &&
      (!q || f.name.toLowerCase().includes(q) || (f.nameJp || "").toLowerCase().includes(q)));
  }, [catKey, query]);

  return (
    <section id={"cat-" + catKey} style={{ background: c.color, color: ink, scrollMarginTop: 0 }}>
      {/* header — info in white text */}
      <div style={{ padding: mobile ? "var(--sp-6) var(--sp-5) var(--sp-5)" : "var(--sp-8) var(--sp-9) var(--sp-7)" }}>
        <h2 style={{ margin: 0, fontFamily: headFont, fontWeight: 600,
          fontSize: "clamp(40px, 6vw, 84px)", lineHeight: 1.04, letterSpacing: "-0.01em" }}>{c.jp}</h2>
        <p style={{ margin: "20px 0 0", maxWidth: "60ch", fontFamily: "var(--font-ui-jp)",
          fontSize: "var(--fs-lead)", lineHeight: "var(--lh-body)", color: inkMuted, textWrap: "pretty" }}>
          {c.desc}
        </p>
        <div style={{ display: "flex", alignItems: "center", gap: 18, marginTop: 28, flexWrap: "wrap" }}>
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="このカテゴリー内を検索…"
            style={{ fontFamily: "var(--font-ui-jp)", fontSize: 14, color: "var(--ink-1)", padding: "9px 15px",
              minWidth: 220, background: "#fff", border: "none", borderRadius: "var(--radius-sm)", outline: "none" }} />
          <span style={{ fontFamily: "var(--font-label)", fontSize: 13, fontWeight: 600, opacity: 0.9 }}>{fonts.length} 書体</span>
        </div>
      </div>

      {/* font detail — white-background specimen cards */}
      <div style={{ padding: mobile ? "0 var(--sp-5) var(--sp-6)" : "0 var(--sp-9) var(--sp-8)" }}>
        {fonts.length ? (
          <div style={{ display: "grid", gridTemplateColumns: mobile ? "1fr" : "repeat(auto-fill, minmax(340px, 1fr))", gap: "var(--sp-5)" }}>
            {fonts.map((f, i) => <FontSpecimen key={f.name} {...f} rank={i + 1} />)}
          </div>
        ) : (
          <div style={{ background: "rgba(255,255,255,0.14)", borderRadius: "var(--radius-md)",
            padding: "var(--sp-7)", textAlign: "center" }}>
            <p style={{ fontFamily: "var(--font-ui-display)", fontSize: 24, margin: 0 }}>該当する書体が見つかりません</p>
            <p style={{ fontFamily: "var(--font-ui-jp)", margin: "8px 0 0", opacity: 0.85 }}>「{query}」の検索結果は0件です。</p>
          </div>
        )}
      </div>

    </section>
  );
}

/* ---------- responsive helper + mobile top menu ---------- */
function useIsMobile(bp = 900) {
  const [m, setM] = useState(typeof window !== "undefined" && window.innerWidth <= bp);
  useEffect(() => {
    const mq = window.matchMedia("(max-width: " + bp + "px)");
    const on = () => setM(mq.matches);
    on();
    mq.addEventListener("change", on);
    return () => mq.removeEventListener("change", on);
  }, [bp]);
  return m;
}

/* horizontal category menu — flows after the MV, sticks to top once passed */
function MobileMenu({ active }) {
  return (
    <nav style={{ position: "sticky", top: 0, zIndex: 40, background: "var(--accent)",
      boxShadow: "var(--shadow-md)", padding: "10px 12px", display: "flex", gap: 8,
      overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
      {ORDER.map((k) => {
        const c = CATS[k];
        const on = active === k;
        return (
          <button key={k} onClick={() => scrollToId("cat-" + k)} style={{
            flex: "0 0 auto", cursor: "pointer", border: "none", borderRadius: "var(--radius-pill)",
            padding: "9px 16px", fontFamily: "var(--font-ui-jp)", fontSize: 14, fontWeight: 600,
            whiteSpace: "nowrap",
            background: on ? "var(--paper-pure)" : c.color,
            color: on ? c.color : (c.ink || "#fff"),
            boxShadow: on ? "0 4px 14px rgba(27,25,22,0.18)" : "none",
            transition: "background var(--dur) var(--ease-out), color var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out)",
          }}>{c.jp}</button>
        );
      })}
    </nav>
  );
}

/* ---------- App ---------- */
function App() {
  const [active, setActive] = useState("home");
  const isMobile = useIsMobile();

  /* scroll-spy: highlight the section currently in view */
  useEffect(() => {
    const ids = ["home", ...ORDER.map((k) => "cat-" + k)];
    const onScroll = () => {
      const mid = window.scrollY + window.innerHeight * 0.35;
      let cur = "home";
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.offsetTop <= mid) cur = id;
      }
      setActive(cur === "home" ? "home" : cur.replace("cat-", ""));
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const backToTop = (
    <div style={{ background: "var(--accent)", display: "flex", justifyContent: "center",
      padding: "var(--sp-8) var(--sp-9)" }}>
      <button onClick={() => scrollToId("home")} style={{ cursor: "pointer", background: "var(--accent-ink)",
        border: "none", color: "var(--accent)", borderRadius: "var(--radius-md)", fontFamily: "var(--font-ui-jp)",
        fontSize: 15, fontWeight: 600, padding: "14px 28px", display: "inline-flex", alignItems: "center", gap: 10 }}>
        <span aria-hidden="true" style={{ fontSize: 18 }}>↑</span>
        ページトップへ戻る
      </button>
    </div>
  );

  /* ---- mobile: stacked MV → sticky menu → sections ---- */
  if (isMobile) {
    return (
      <div style={{ minHeight: "100vh", background: "var(--accent)" }}>
        <MV mobile />
        <MobileMenu active={active} />
        {ORDER.map((k) => <CategorySection key={k} catKey={k} mobile />)}
        {backToTop}
      </div>
    );
  }

  /* ---- desktop: fixed left sidebar ---- */
  return (
    <div style={{ minHeight: "100vh", background: "var(--accent)" }}>
      <Sidebar active={active} />
      <main style={{ marginLeft: SIDEBAR_W, minHeight: "100vh" }}>
        <MV />
        {ORDER.map((k) => <CategorySection key={k} catKey={k} />)}
        {backToTop}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
